apiVersion: postgres.stratio.com/v1
kind: PgDatabase
metadata:
  name: data
  namespace: dev-datastores
spec:
  dropOnDelete: false
  name: data
  parameters:
    allowconn: true
    connlimit: 50000
    encoding: UTF-8
    istemplate: false
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
  postgresql:
    connectionMode: PRIMARY
    name: psql
    namespace: dev-datastores
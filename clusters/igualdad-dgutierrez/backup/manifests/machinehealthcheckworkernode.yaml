
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: igualdad-dgutierrez-worker-node-unhealthy
  namespace: cluster-igualdad-dgutierrez
spec:
  clusterName: igualdad-dgutierrez
  nodeStartupTimeout: 300s
  maxUnhealthy: 100%
  selector:
    matchLabels:
      keos.stratio.com/machine-role: igualdad-dgutierrez-worker-node
  unhealthyConditions:
    - type: Ready
      status: Unknown
      timeout: 180s
    - type: Ready
      status: 'False'
      timeout: 180s

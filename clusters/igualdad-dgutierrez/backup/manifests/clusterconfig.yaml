apiVersion: installer.stratio.com/v1beta1
kind: ClusterConfig
metadata:
    name: igualdad-dgutierrez
    namespace: cluster-igualdad-dgutierrez
spec:
    eks_lb_controller: false
    private_registry: true
    controlplane_config: {}
    workers_config:
        max_unhealthy: 100
    cluster_operator_version: 0.7.4
    cluster_operator_image_version: 0.7.4
    private_helm_repo: true
    charts:
        - name: cert-manager
          version: v1.21.2
        - name: flux2
          version: 2.17.2
        - name: tigera-operator
          version: v3.31.7
    capx:
        capi_version: v1.10.10
        capa_version: v2.9.3
        capa_image_version: v2.9.3
        capg_version: 1.6.1-0.4.2
        capg_image_version: 1.6.1-0.4.2
        capz_version: v1.21.3
        capz_image_version: v1.21.3
    gitops_enabled: false

